<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Custom Div Dropdown</title>
	<style>
		:root{--bg:#fff;--primary:#2b6ef6;--muted:#6b7280;--border:#e5e7eb}
		body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;margin:40px;background:#f7fafc;color:#0f172a}
		h1{font-size:18px;margin-bottom:12px}

		/* Dropdown container */
		.custom-select{position:relative;width:260px;user-select:none}
		.custom-select .control{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,0.03)}
		.custom-select .control:focus{outline:2px solid rgba(43,110,246,0.18)}
		.custom-select .selected{color:#111827}
		.custom-select .placeholder{color:var(--muted)}
		.custom-select .caret{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;transform:rotate(0);transition:transform .18s ease}
		.custom-select.open .caret{transform:rotate(180deg)}

		/* Options panel */
		.custom-select .options{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 6px;box-shadow:0 6px 18px rgba(2,6,23,0.08);max-height:0;overflow:hidden;opacity:0;visibility:hidden;transform-origin:top center;transition:all .18s ease}
		.custom-select.open .options{max-height:240px;opacity:1;visibility:visible}
		.custom-select .option{padding:10px 12px;border-radius:6px;cursor:pointer;color:#0f172a}
		.custom-select .option:hover{background:#f1f5f9}
		.custom-select .option.selected{background:rgba(43,110,246,0.08);color:var(--primary);font-weight:600}

		/* Small helper styles */
		.note{margin-top:16px;color:var(--muted);font-size:13px}
	</style>
</head>
<body>
	<h1>Custom dropdown (built using divs)</h1>

	<div class="custom-select" id="my-select" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
		<div class="control" id="select-control">
			<div class="selected placeholder">Choose an option</div>
			<div class="caret">▾</div>
		</div>
		<div class="options" role="listbox">
			<div class="option" role="option" data-value="1">Option One</div>
			<div class="option" role="option" data-value="2">Option Two</div>
			<div class="option" role="option" data-value="3">Option Three</div>
			<div class="option" role="option" data-value="4">Option Four</div>
		</div>
	</div>

	<input type="hidden" id="selected-value" name="selected" />
	<div class="note">Selected value: <span id="debug-val">none</span></div>

	<script>
		(function(){
			const select = document.getElementById('my-select');
			const control = document.getElementById('select-control');
			const options = select.querySelector('.options');
			const opts = Array.from(select.querySelectorAll('.option'));
			const hidden = document.getElementById('selected-value');
			const debug = document.getElementById('debug-val');

			function open(){ select.classList.add('open'); select.setAttribute('aria-expanded','true'); }
			function close(){ select.classList.remove('open'); select.setAttribute('aria-expanded','false'); }
			function toggle(){ select.classList.contains('open') ? close() : open(); }

			control.addEventListener('click', (e)=>{ e.stopPropagation(); toggle(); });

			opts.forEach(o=>{
				o.addEventListener('click', (ev)=>{
					ev.stopPropagation();
					opts.forEach(x=>x.classList.remove('selected'));
					o.classList.add('selected');
					const val = o.getAttribute('data-value');
					const label = o.textContent.trim();
					const selectedEl = select.querySelector('.selected');
					selectedEl.textContent = label;
					selectedEl.classList.remove('placeholder');
					hidden.value = val;
					debug.textContent = val;
					close();
				});
			});

			// Close when clicking outside
			document.addEventListener('click', (e)=>{ if(!select.contains(e.target)) close(); });

			// Keyboard: Enter/Space toggles, Escape closes
			select.addEventListener('keydown', (e)=>{
				if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
				if(e.key === 'Escape') close();
			});

			// Optional: set initial value if any option has .selected in markup
			const initial = opts.find(o=>o.classList.contains('selected'));
			if(initial){ hidden.value = initial.getAttribute('data-value'); debug.textContent = hidden.value; select.querySelector('.selected').textContent = initial.textContent.trim(); select.querySelector('.selected').classList.remove('placeholder'); }
		})();
	</script>
</body>
</html>
